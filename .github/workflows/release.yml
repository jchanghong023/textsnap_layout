name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub-hosted Windows x64 release
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ROOT: ${{ vars.TEXTSNAP_BUILD_ROOT || 'C:\ts' }}
      CACHE_DIR: ${{ vars.TEXTSNAP_BUILD_CACHE || 'C:\ts\cache' }}
      TOOLCHAIN_PREFIX: ${{ vars.TEXTSNAP_TOOLCHAIN_PREFIX }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          architecture: x64

      - name: Cache locked build inputs
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: textsnap-win-x64-${{ hashFiles('vendor-lock/*.json') }}
      - name: Verify release host and tools
        id: metadata
        run: |
          $ErrorActionPreference = 'Stop'


          foreach ($tool in @('gh', 'python')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool is not available on PATH: $tool"
            }
          }
          foreach ($tool in @("${env:TOOLCHAIN_PREFIX}gcc", "${env:TOOLCHAIN_PREFIX}windres")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required MinGW tool is not available on PATH: $tool"
            }
          }

          $python = (Get-Command python -ErrorAction Stop).Source
          $pythonVersion = (& $python -I -B -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -ne '3.13.14') {
            throw "Release builds require CPython 3.13.14; found $pythonVersion."
          }

          $version = (& $python -B -c "from scripts.release_pipeline import PRODUCT_VERSION; print(PRODUCT_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid PRODUCT_VERSION: $version"
          }
          $tag = "v$version"
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match source version $tag."
          }

          $runSuffix = '${{ github.run_id }}-${{ github.run_attempt }}'
          $stageDir = Join-Path $env:BUILD_ROOT "b\TextSnapLayout-$runSuffix"
          $outputDir = Join-Path $env:BUILD_ROOT "a\$runSuffix"
          "PYTHON_FOR_BYTECODE=$python" >> $env:GITHUB_ENV
          "STAGE_DIR=$stageDir" >> $env:GITHUB_ENV
          "OUTPUT_DIR=$outputDir" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=TextSnapLayout-$version-win-x64.zip" >> $env:GITHUB_OUTPUT


      - name: Build and statically verify portable package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:CACHE_DIR, $env:OUTPUT_DIR | Out-Null

          & $env:PYTHON_FOR_BYTECODE -B -m scripts.build_release validate-lock --lock-dir vendor-lock
          if ($LASTEXITCODE -ne 0) { throw 'validate-lock failed.' }

          & $env:PYTHON_FOR_BYTECODE -B -m scripts.build_release fetch --lock-dir vendor-lock --cache-dir $env:CACHE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed.' }

          & $env:PYTHON_FOR_BYTECODE -B -m scripts.build_release validate-wheel-closure --lock-dir vendor-lock --cache-dir $env:CACHE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'validate-wheel-closure failed.' }

          $stageArguments = @(
            '-B', '-m', 'scripts.build_release', 'stage',
            '--profile', 'private-use',
            '--lock-dir', 'vendor-lock',
            '--cache-dir', $env:CACHE_DIR,
            '--stage-dir', $env:STAGE_DIR,
            '--python-for-bytecode', $env:PYTHON_FOR_BYTECODE
          )
          if ($env:TOOLCHAIN_PREFIX) {
            $stageArguments += @('--toolchain-prefix', $env:TOOLCHAIN_PREFIX)
          }
          & $env:PYTHON_FOR_BYTECODE @stageArguments
          if ($LASTEXITCODE -ne 0) { throw 'stage failed.' }

          & $env:PYTHON_FOR_BYTECODE -B -m scripts.build_release verify --lock-dir vendor-lock --stage-dir $env:STAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'verify failed.' }

          & $env:PYTHON_FOR_BYTECODE -B -m scripts.build_release package --lock-dir vendor-lock --stage-dir $env:STAGE_DIR --output-dir $env:OUTPUT_DIR
          if ($LASTEXITCODE -ne 0) { throw 'package failed.' }

      - name: Run embedded portable-package integration
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path -LiteralPath $env:STAGE_DIR).Path
          $embeddedPython = Join-Path $bundle 'runtime\pythonw.exe'
          $runner = (Resolve-Path -LiteralPath 'tests\windows\verify_extracted_bundle.py').Path
          if (-not (Test-Path -LiteralPath $embeddedPython -PathType Leaf)) {
            throw "Embedded Python was not staged: $embeddedPython"
          }

          $resultDirectory = Join-Path $env:RUNNER_TEMP "textsnap-integration-${{ github.run_id }}-${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force -Path $resultDirectory | Out-Null
          $result = Join-Path $resultDirectory 'result.json'
          $progress = "$result.progress.jsonl"
          Remove-Item -LiteralPath $result, $progress -Force -ErrorAction SilentlyContinue

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $embeddedPython
          $startInfo.UseShellExecute = $false
          foreach ($argument in @(
            '-I', '-B', $runner,
            '--bundle', $bundle,
            '--result', $result
          )) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if ($null -eq $process) {
            throw 'Failed to start the embedded integration runner.'
          }
          $process.WaitForExit()
          $integrationExitCode = $process.ExitCode
          $process.Dispose()

          if (-not (Test-Path -LiteralPath $result -PathType Leaf)) {
            if (Test-Path -LiteralPath $progress -PathType Leaf) {
              Get-Content -LiteralPath $progress
            }
            throw 'Embedded integration runner did not produce a result.'
          }
          $resultJson = Get-Content -LiteralPath $result -Raw
          $document = $resultJson | ConvertFrom-Json
          if (
            $integrationExitCode -ne 0 -or
            $document.ok -ne $true -or
            $document.status -ne 'passed'
          ) {
            Write-Host $resultJson
            if (Test-Path -LiteralPath $progress -PathType Leaf) {
              Get-Content -LiteralPath $progress
            }
            throw "Embedded portable-package integration failed with exit code $integrationExitCode."
          }
          Write-Host $resultJson

      - name: Run embedded real OCR corpus regression
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path -LiteralPath $env:STAGE_DIR).Path
          $embeddedPython = Join-Path $bundle 'runtime\pythonw.exe'
          $testScript = (Resolve-Path -LiteralPath 'tests\integration\test_real_ocr.py').Path
          $modelRoot = Join-Path $bundle 'models'
          $fontFile = Join-Path $bundle 'assets\fonts\NotoSansMonoCJKsc-Regular.otf'
          foreach ($requiredFile in @($embeddedPython, $testScript, $fontFile)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Real OCR prerequisite is missing: $requiredFile"
            }
          }
          if (-not (Test-Path -LiteralPath $modelRoot -PathType Container)) {
            throw "Real OCR model root is missing: $modelRoot"
          }

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $embeddedPython
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.Environment['TEXTSNAP_RUN_REAL_OCR'] = '1'
          $startInfo.Environment['TEXTSNAP_TEST_MODEL_ROOT'] = $modelRoot
          $startInfo.Environment['TEXTSNAP_TEST_FONT'] = $fontFile
          foreach ($argument in @('-I', '-B', $testScript)) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if ($null -eq $process) {
            throw 'Failed to start the embedded real OCR regression.'
          }
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $process.WaitForExit()
          $ocrExitCode = $process.ExitCode
          $stdoutText = $stdout.GetAwaiter().GetResult()
          $stderrText = $stderr.GetAwaiter().GetResult()
          $process.Dispose()
          if ($stdoutText) {
            Write-Host $stdoutText
          }
          if ($stderrText) {
            Write-Host $stderrText
          }
          if ($ocrExitCode -ne 0) {
            throw "Embedded real OCR corpus regression failed with exit code $ocrExitCode."
          }

      - name: Verify release checksum
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:OUTPUT_DIR '${{ steps.metadata.outputs.archive }}'
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release archive was not produced: $archive"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum was not produced: $checksum"
          }

          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual."
          }


      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextSnapLayout-${{ steps.metadata.outputs.version }}-win-x64
          path: |
            ${{ env.BUILD_ROOT }}\a\${{ github.run_id }}-${{ github.run_attempt }}\*.zip
            ${{ env.BUILD_ROOT }}\a\${{ github.run_id }}-${{ github.run_attempt }}\*.sha256
          if-no-files-found: error
          compression-level: 0


      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.metadata.outputs.tag }}'
          $archive = Join-Path $env:OUTPUT_DIR '${{ steps.metadata.outputs.archive }}'
          $checksum = "$archive.sha256"

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release already exists: $tag"
          }

          $releaseArguments = @(
            'release', 'create', $tag,
            $archive, $checksum,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "TextSnap Layout $tag",
            '--generate-notes'
          )
          if ('${{ github.event_name }}' -eq 'push') {
            $releaseArguments += '--verify-tag'
          } else {
            $releaseArguments += @('--target', $env:GITHUB_SHA)
          }

          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag." }

      - name: Remove transient build directories
        if: always()
        run: |
          if ($env:STAGE_DIR) {
            Remove-Item -LiteralPath $env:STAGE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($env:OUTPUT_DIR) {
            Remove-Item -LiteralPath $env:OUTPUT_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
